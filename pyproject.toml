[project]
name = "agent-foundry"
version = "0.1.0"
description = "A factory (and runtime) that turns an ordered goal into a running army of specialised micro-node jobs over the estate's single NATS bus."
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.15",
    "jsonschema>=4.0",
    "beautifulsoup4>=4.12",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
agent-foundry = "af.cli:main"

# Estate python standard (mirrors idp/pyproject.toml, crew#325): the narrow set
# that finds real defects — syntax errors, undefined names, misused expressions.
# Deliberately not ruff's wide default: per the estate's own measure (2026-08-26,
# 91 extra findings of which 44 were E702), widening adds churn, not defects.
[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# assert is the idiom of a pytest suite, not a security defect. The estate runs
# the same selection over idp/tests; bare asserts belong in tests, never in `af/`.
"tests/*.py" = ["S101"]
"conftest.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
